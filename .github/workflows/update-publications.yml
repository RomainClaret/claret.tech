name: Update Publications

# Automatic updates are disabled: publications are manually curated.
# Trigger this workflow manually from the GitHub Actions tab when needed.
on:
  workflow_dispatch:

# Each job asks for what it needs: the fetch runs third-party data and the
# install scripts with a read-only token, and the job that can write opens
# the pull request alone, with no install and no third-party input but the
# file it reviews.
permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check-changes.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # The fetch needs dotenv alone: no package's install script runs.
        run: npm ci --ignore-scripts

      - name: Fetch publications
        env:
          SEMANTIC_SCHOLAR_AUTHOR_ID: ${{ secrets.SEMANTIC_SCHOLAR_AUTHOR_ID }}
          ORCID_ID: ${{ secrets.ORCID_ID }}
          AUTHOR_NAME: ${{ secrets.AUTHOR_NAME || 'Romain Claret' }}
        run: |
          echo "🔍 Fetching publications..."
          node scripts/fetch-publications.js

      - name: Check for changes
        id: check-changes
        run: |
          git diff --quiet public/publications.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Keep the fetched file
        if: steps.check-changes.outputs.changed == 'true'
        # As every upload (ci-workflows.test.ts): a failed upload still shows,
        # as the pull-request job's download fails.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: publications
          path: public/publications.json
          retention-days: 1

  pull-request:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Take the fetched file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: publications
          path: public

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        # Never under act (which sets ACT): with a token it would open a real
        # pull request.
        if: ${{ !env.ACT }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: public/publications.json
          commit-message: 'chore: update publications data'
          title: 'Update Publications Data'
          body: |
            ## Automated Publications Update

            This PR updates the publications data from academic sources:
            - Semantic Scholar
            - ORCID

            The data was fetched on ${{ steps.date.outputs.date }}.

            Please review the changes and merge if everything looks correct.
          branch: update-publications-${{ github.run_number }}
          delete-branch: true
