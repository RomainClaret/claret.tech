name: Playwright Tests
on:
  workflow_dispatch:  # Allow manual triggering to control quota usage
    inputs:
      force_all_tests:
        description: 'Force run all tests (ignore change detection)'
        required: false
        type: boolean
        default: false
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'          # Skip documentation changes
      - '.github/workflows/ci.yml'  # Skip CI-only changes
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'          # Skip documentation changes
      - '.github/workflows/ci.yml'  # Skip CI-only changes
      - 'LICENSE'
      - '.gitignore'

# Cancel superseded runs of the same ref: each run fans out to sharded
# browser matrices, so stacked runs are expensive.
# Least privilege: these workflows only read the repo and run tests.
# Without this they inherit the repo default, which is write.
permissions:
  contents: read

# Each push to main in a group of its own, as in ci.yml: a push is diffed
# against the previous head, so a cancelled or replaced run there would leave
# the changes in between untested.
concurrency:
  group: e2e-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  # Skip external API calls in CI for stability
  SKIP_EXTERNAL_APIS: true

# There is deliberately no apt step installing cairo/pango/etc. It existed so
# `npm ci` could compile the `canvas` devDependency from source, and it had
# become the single largest cost in this workflow: 8-18 minutes per job against
# ~1 minute of actual tests, and on 2026-08-04 it hit the 30-minute job timeout
# and cancelled three firefox jobs before they ran a single test.
#
# It was never needed. canvas 2.11.2 publishes a prebuilt binary for Node 20 on
# linux-glibc-x64 (node-v115), so it installs without any dev headers. Verified
# in mcr.microsoft.com/playwright:v1.57.0-jammy with Node 20.19.0 and no apt
# packages: full `npm ci` succeeds in 86s and canvas, sharp and jsdom all load.
# Nothing else in the tree compiles from source.
#
# The images follow @playwright/test (pinned exactly in package.json): the
# browsers in the image are the ones that version drives. Both v1.57.0-jammy
# and v1.64.0-jammy (2026-10-12) default to Node 24, which has no canvas
# binary; the prebuilt one installs only because setup-node below pins Node 20.
#
# QUOTA OPTIMIZATION FEATURES:
# - workflow_dispatch: Manual triggering to control usage
# - paths-ignore: Skip runs for documentation and non-code changes
# - Playwright browser caching: Reduce browser download time and quota usage
# - npm caching: Already enabled via actions/setup-node cache parameter

jobs:
  # Detect changed files to run only relevant tests
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
      navigation: ${{ steps.filter.outputs.navigation }}
      accessibility: ${{ steps.filter.outputs.accessibility }}
      performance: ${{ steps.filter.outputs.performance }}
      terminal: ${{ steps.filter.outputs.terminal }}
      lighthouse: ${{ steps.filter.outputs.lighthouse }}
      mobile: ${{ steps.filter.outputs.mobile }}
      src: ${{ steps.filter.outputs.src }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The commit history, for the diff base below, but not the old
          # contents of files: the diff compares trees.
          fetch-depth: 0
          filter: blob:none

      # HEAD~1 covered only the last commit of a push, so the e2e suites for
      # files an earlier commit touched were skipped.
      - name: Get base commit
        id: base_commit
        env:
          # A manual run diffs the last commit (HEAD~1, what the script does
          # for a pull request), as it did before the script: force_all_tests
          # is how a manual run asks for every suite. Passed as is, it got
          # the "check everything" base meant for the deploy calling ci.yml,
          # and every suite ran whatever the input said.
          EVENT: ${{ github.event_name == 'workflow_dispatch' && 'pull_request' || github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=$(bash .github/scripts/diff-base.sh)
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          base: ${{ steps.base_commit.outputs.base }}
          filters: |
            tests:
              - 'tests/**'
            navigation:
              - 'tests/e2e/navigation.spec.ts'
              - 'src/**/nav*.{ts,tsx}'
              - 'src/**/header*.{ts,tsx}'
              - 'src/**/menu*.{ts,tsx}'
              - 'src/components/layout/**'
              # Shared helpers every spec imports. Without this a fix to
              # tests/e2e/utils/ skips the very suite it was written for:
              # terminal-utils.ts changed on 2026-08-04 and terminal-tests did
              # not run, so the change shipped unverified.
              - 'tests/e2e/utils/**'
            accessibility:
              - 'tests/e2e/accessibility.spec.ts'
              - 'tests/e2e/project-details.spec.ts'
              - 'src/**/*aria*.{ts,tsx}'
              - 'src/**/*a11y*.{ts,tsx}'
              - 'src/**/*accessibility*.{ts,tsx}'
              - 'src/**/theme*.{ts,tsx}'
              # Shared helpers every spec imports. Without this a fix to
              # tests/e2e/utils/ skips the very suite it was written for:
              # terminal-utils.ts changed on 2026-08-04 and terminal-tests did
              # not run, so the change shipped unverified.
              - 'tests/e2e/utils/**'
            performance:
              - 'tests/e2e/performance.spec.ts'
              - 'tests/e2e/static-shell.spec.ts'
              - 'tests/e2e/motion-fallback.spec.ts'
              - 'tests/e2e/pdf-reader.spec.ts'
              - 'src/**/*performance*.{ts,tsx}'
              - 'src/**/*optimization*.{ts,tsx}'
              - 'src/**/*lazy*.{ts,tsx}'
              # Shared helpers every spec imports. Without this a fix to
              # tests/e2e/utils/ skips the very suite it was written for:
              # terminal-utils.ts changed on 2026-08-04 and terminal-tests did
              # not run, so the change shipped unverified.
              - 'tests/e2e/utils/**'
            terminal:
              - 'tests/e2e/terminal.spec.ts'
              - 'tests/e2e/python-terminal.spec.ts'
              - 'src/**/terminal/**'
              - 'src/**/*terminal*.{ts,tsx}'
              - 'src/**/*command*.{ts,tsx}'
              - 'src/lib/python/**'
              - 'public/python-worker.js'
              # Shared helpers every spec imports. Without this a fix to
              # tests/e2e/utils/ skips the very suite it was written for:
              # terminal-utils.ts changed on 2026-08-04 and terminal-tests did
              # not run, so the change shipped unverified.
              - 'tests/e2e/utils/**'
            lighthouse:
              - 'tests/e2e/lighthouse.spec.ts'
              - 'next.config.*'
              - 'src/app/**'
              - 'src/**/optimization*.{ts,tsx}'
              # Shared helpers every spec imports. Without this a fix to
              # tests/e2e/utils/ skips the very suite it was written for:
              # terminal-utils.ts changed on 2026-08-04 and terminal-tests did
              # not run, so the change shipped unverified.
              - 'tests/e2e/utils/**'
            mobile:
              - 'tests/e2e/mobile-navigation.spec.ts'
              - 'tests/e2e/mobile-accessibility.spec.ts'
              - 'src/**/*mobile*.{ts,tsx}'
              - 'src/**/*responsive*.{ts,tsx}'
              - 'src/**/*breakpoint*.{ts,tsx}'
              - 'tailwind.config.*'
              # Shared helpers every spec imports. Without this a fix to
              # tests/e2e/utils/ skips the very suite it was written for:
              # terminal-utils.ts changed on 2026-08-04 and terminal-tests did
              # not run, so the change shipped unverified.
              - 'tests/e2e/utils/**'
            src:
              - 'src/**'
              - 'public/**'
              - 'styles/**'
              # next.config.mjs, tailwind.config.ts, playwright.config.ts...
              - '*.config.{js,mjs,ts}'
            dependencies:
              - 'package.json'
              - 'package-lock.json'
              - 'yarn.lock'
              - 'pnpm-lock.yaml'
            workflows:
              - '.github/workflows/**'
              - '.github/scripts/**'

  # Navigation tests across browsers
  navigation-tests:
    needs: detect-changes
    if: |
      always() && !cancelled() &&
      (github.ref == 'refs/heads/main' ||
       needs.detect-changes.outputs.navigation == 'true' ||
       needs.detect-changes.outputs.src == 'true' ||
       needs.detect-changes.outputs.dependencies == 'true' ||
       needs.detect-changes.outputs.workflows == 'true')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-jammy
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache Playwright test results to avoid re-running unchanged tests
      - name: Cache Navigation test results
        uses: actions/cache@v5
        with:
          path: |
            playwright-report/
            test-results/
            .playwright-cache/
          key: playwright-navigation-${{ matrix.browser }}-${{ hashFiles('tests/e2e/navigation.spec.ts', 'src/**/nav*.{ts,tsx}', 'src/**/header*.{ts,tsx}', 'src/**/menu*.{ts,tsx}', 'src/components/layout/**', 'package-lock.json') }}
          restore-keys: |
            playwright-navigation-${{ matrix.browser }}-${{ github.ref_name }}-
            playwright-navigation-${{ matrix.browser }}-

      - name: Install Playwright Browser
        run: npx playwright install ${{ matrix.browser }}

      - name: Build Next.js Application
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Must be set HERE, on the build, not on `npm start`. Next evaluates
          # headers() during `next build` and bakes the result into
          # .next/routes-manifest.json; the runtime server only replays it, so
          # setting this at start time is silently inert (verified: build
          # without it + start with it still sends upgrade-insecure-requests).
          #
          # These jobs serve the production build over http://localhost:3000,
          # and that directive makes WebKit rewrite every asset URL to https
          # and fail on TLS - no CSS, no chunks, no React, 19 failed requests.
          # Vercel never sets this, so the deployed site keeps HSTS and both
          # https-forcing directives.
          SERVE_HTTP: "true"
          NEXT_PUBLIC_SITE_URL: https://claret.tech
          NEXT_PUBLIC_ENABLE_TERMINAL: true
          NEXT_PUBLIC_DEFAULT_LLM_MODEL: llama-3.2-1b
          NEXT_PUBLIC_ENABLE_AI_FEATURES: true
          USE_GITHUB_DATA: false
          MEDIUM_USERNAME: mock_username

      - name: Start Next.js Application
        run: |
          npm start &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          
          # Wait for server to be ready with retry logic
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200"; then
              echo "✅ Server is ready (attempt $i/30)"
              break
            fi
            echo "⏳ Waiting for server to start (attempt $i/30)..."
            sleep 2
          done
          
          # Final health check
          if ! curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200"; then
            echo "❌ Server failed to start after 60 seconds"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Navigation Tests
        run: npx playwright test tests/e2e/navigation.spec.ts --project=${{ matrix.browser }} --max-failures=3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_EXTERNAL_APIS: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          HOME: /root

      - name: Stop Next.js Server
        if: always()
        run: |
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID || true
            echo "🛑 Server stopped (PID: $SERVER_PID)"
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: navigation-tests-${{ matrix.browser }}-report
          path: playwright-report/
          retention-days: 30

  # Accessibility tests across browsers
  accessibility-tests:
    needs: detect-changes
    if: |
      always() && !cancelled() &&
      (github.ref == 'refs/heads/main' ||
       needs.detect-changes.outputs.accessibility == 'true' ||
       needs.detect-changes.outputs.src == 'true' ||
       needs.detect-changes.outputs.dependencies == 'true' ||
       needs.detect-changes.outputs.workflows == 'true')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-jammy
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]  # Skip firefox for accessibility due to timeouts

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browser
        run: npx playwright install ${{ matrix.browser }}

      - name: Build Next.js Application
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Must be set HERE, on the build, not on `npm start`. Next evaluates
          # headers() during `next build` and bakes the result into
          # .next/routes-manifest.json; the runtime server only replays it, so
          # setting this at start time is silently inert (verified: build
          # without it + start with it still sends upgrade-insecure-requests).
          #
          # These jobs serve the production build over http://localhost:3000,
          # and that directive makes WebKit rewrite every asset URL to https
          # and fail on TLS - no CSS, no chunks, no React, 19 failed requests.
          # Vercel never sets this, so the deployed site keeps HSTS and both
          # https-forcing directives.
          SERVE_HTTP: "true"
          NEXT_PUBLIC_SITE_URL: https://claret.tech
          NEXT_PUBLIC_ENABLE_TERMINAL: true
          NEXT_PUBLIC_DEFAULT_LLM_MODEL: llama-3.2-1b
          NEXT_PUBLIC_ENABLE_AI_FEATURES: true
          USE_GITHUB_DATA: false
          MEDIUM_USERNAME: mock_username

      - name: Start Next.js Application
        run: |
          npm start &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          
          # Wait for server to be ready with retry logic
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200"; then
              echo "✅ Server is ready (attempt $i/30)"
              break
            fi
            echo "⏳ Waiting for server to start (attempt $i/30)..."
            sleep 2
          done
          
          # Final health check
          if ! curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200"; then
            echo "❌ Server failed to start after 60 seconds"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Accessibility Tests
        # project-details: a GitHub card's details open in one dialog above
        # the page (focus, Tab, Escape, the links take their own clicks), on
        # desktop and a 390 px phone, with the GitHub APIs answered by
        # fixtures since CI builds have no GitHub data.
        run: npx playwright test tests/e2e/accessibility.spec.ts tests/e2e/project-details.spec.ts --project=${{ matrix.browser }} --max-failures=3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_EXTERNAL_APIS: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          HOME: /root

      - name: Stop Next.js Server
        if: always()
        run: |
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID || true
            echo "🛑 Server stopped (PID: $SERVER_PID)"
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: accessibility-tests-${{ matrix.browser }}-report
          path: playwright-report/
          retention-days: 30

  # Performance tests (chromium only for efficiency)
  performance-tests:
    needs: detect-changes
    if: |
      github.event.inputs.force_all_tests == 'true' ||
      needs.detect-changes.outputs.performance == 'true' ||
      needs.detect-changes.outputs.src == 'true' ||
      needs.detect-changes.outputs.dependencies == 'true' ||
      needs.detect-changes.outputs.workflows == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-jammy
      options: --user root

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browser
        run: npx playwright install chromium

      - name: Build Next.js Application
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Must be set HERE, on the build, not on `npm start`. Next evaluates
          # headers() during `next build` and bakes the result into
          # .next/routes-manifest.json; the runtime server only replays it, so
          # setting this at start time is silently inert (verified: build
          # without it + start with it still sends upgrade-insecure-requests).
          #
          # These jobs serve the production build over http://localhost:3000,
          # and that directive makes WebKit rewrite every asset URL to https
          # and fail on TLS - no CSS, no chunks, no React, 19 failed requests.
          # Vercel never sets this, so the deployed site keeps HSTS and both
          # https-forcing directives.
          SERVE_HTTP: "true"
          NEXT_PUBLIC_SITE_URL: https://claret.tech
          NEXT_PUBLIC_ENABLE_TERMINAL: true
          NEXT_PUBLIC_DEFAULT_LLM_MODEL: llama-3.2-1b
          NEXT_PUBLIC_ENABLE_AI_FEATURES: true
          USE_GITHUB_DATA: false
          MEDIUM_USERNAME: mock_username

      - name: Start Next.js Application
        run: |
          npm start &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          
          # Wait for server to be ready with retry logic
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200"; then
              echo "✅ Server is ready (attempt $i/30)"
              break
            fi
            echo "⏳ Waiting for server to start (attempt $i/30)..."
            sleep 2
          done
          
          # Final health check
          if ! curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200"; then
            echo "❌ Server failed to start after 60 seconds"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Performance Tests
        # static-shell: the homepage is generated at build time; its first
        # paint, its hydration, its no-script page, its page when the bundle
        # never runs, and no splash over a page already on screen, on this
        # same build. motion-fallback: the content framer starts at opacity 0
        # shows when its features fail, the bundle never runs or scripts are
        # off, and waits for its animation otherwise. pdf-reader: the reader
        # draws a canvas only for the pages near the view, and its counter
        # names the page in view after a scroll, a zoom and a reload.
        run: npx playwright test tests/e2e/performance.spec.ts tests/e2e/static-shell.spec.ts tests/e2e/motion-fallback.spec.ts tests/e2e/pdf-reader.spec.ts --project=chromium --max-failures=2 --grep-invert "Lighthouse|Safari-Specific"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_EXTERNAL_APIS: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          HOME: /root

      - name: Stop Next.js Server
        if: always()
        run: |
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID || true
            echo "🛑 Server stopped (PID: $SERVER_PID)"
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: performance-tests-report
          path: playwright-report/
          retention-days: 30

  # Terminal tests (heavy - 38 tests) split into multiple shards
  terminal-tests:
    needs: detect-changes
    # Only run if terminal-related files or core src changed
    if: |
      github.event.inputs.force_all_tests == 'true' ||
      needs.detect-changes.outputs.terminal == 'true' ||
      needs.detect-changes.outputs.src == 'true' ||
      needs.detect-changes.outputs.dependencies == 'true' ||
      needs.detect-changes.outputs.workflows == 'true'
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-jammy
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1-of-3, 2-of-3, 3-of-3]  # Split terminal tests across 3 shards

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache Terminal test results to avoid re-running unchanged tests
      - name: Cache Terminal test results
        uses: actions/cache@v5
        with:
          path: |
            playwright-report/
            test-results/
            .playwright-cache/
          key: playwright-terminal-${{ matrix.browser }}-${{ matrix.shard }}-${{ hashFiles('tests/e2e/terminal.spec.ts', 'src/**/terminal/**', 'src/**/*terminal*.{ts,tsx}', 'src/**/*command*.{ts,tsx}', 'package-lock.json') }}
          restore-keys: |
            playwright-terminal-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.ref_name }}-
            playwright-terminal-${{ matrix.browser }}-${{ matrix.shard }}-

      - name: Install Playwright Browser
        run: npx playwright install ${{ matrix.browser }}

      - name: Build Next.js Application
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Must be set HERE, on the build, not on `npm start`. Next evaluates
          # headers() during `next build` and bakes the result into
          # .next/routes-manifest.json; the runtime server only replays it, so
          # setting this at start time is silently inert (verified: build
          # without it + start with it still sends upgrade-insecure-requests).
          #
          # These jobs serve the production build over http://localhost:3000,
          # and that directive makes WebKit rewrite every asset URL to https
          # and fail on TLS - no CSS, no chunks, no React, 19 failed requests.
          # Vercel never sets this, so the deployed site keeps HSTS and both
          # https-forcing directives.
          SERVE_HTTP: "true"
          NEXT_PUBLIC_SITE_URL: https://claret.tech
          NEXT_PUBLIC_ENABLE_TERMINAL: true
          NEXT_PUBLIC_DEFAULT_LLM_MODEL: llama-3.2-1b
          NEXT_PUBLIC_ENABLE_AI_FEATURES: true
          USE_GITHUB_DATA: false
          MEDIUM_USERNAME: mock_username

      - name: Start Next.js Application
        run: |
          npm start &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          
          # Wait for server to be ready with retry logic
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200"; then
              echo "✅ Server is ready (attempt $i/30)"
              break
            fi
            echo "⏳ Waiting for server to start (attempt $i/30)..."
            sleep 2
          done
          
          # Final health check
          if ! curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200"; then
            echo "❌ Server failed to start after 60 seconds"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Terminal Tests
        run: |
          # Convert shard format for Playwright (e.g., 1-of-3 -> 1/3)
          SHARD_PLAYWRIGHT=$(echo "${{ matrix.shard }}" | sed 's/-of-/\//g')
          # python-terminal.spec.ts skips itself on non-chromium projects, so
          # the webkit and firefox shards cost nothing here. It is the only
          # place the sandbox is exercised for real rather than against mocks.
          npx playwright test tests/e2e/terminal.spec.ts tests/e2e/python-terminal.spec.ts --project=${{ matrix.browser }} --shard="$SHARD_PLAYWRIGHT" --max-failures=2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_EXTERNAL_APIS: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          HOME: /root  # Fix Firefox launch issue

      - name: Stop Next.js Server
        if: always()
        run: |
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID || true
            echo "🛑 Server stopped (PID: $SERVER_PID)"
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true  # Don't fail job if artifact upload fails
        with:
          name: terminal-tests-${{ matrix.browser }}-${{ matrix.shard }}-report
          path: playwright-report/
          retention-days: 30

  # Mobile testing
  mobile-tests:
    needs: detect-changes
    # Only run if mobile-specific files or critical dependencies changed
    if: |
      github.event.inputs.force_all_tests == 'true' ||
      needs.detect-changes.outputs.mobile == 'true' ||
      needs.detect-changes.outputs.dependencies == 'true' ||
      needs.detect-changes.outputs.navigation == 'true' ||
      needs.detect-changes.outputs.workflows == 'true'
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-jammy
      options: --user root

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium webkit

      - name: Build Next.js Application
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Must be set HERE, on the build, not on `npm start`. Next evaluates
          # headers() during `next build` and bakes the result into
          # .next/routes-manifest.json; the runtime server only replays it, so
          # setting this at start time is silently inert (verified: build
          # without it + start with it still sends upgrade-insecure-requests).
          #
          # These jobs serve the production build over http://localhost:3000,
          # and that directive makes WebKit rewrite every asset URL to https
          # and fail on TLS - no CSS, no chunks, no React, 19 failed requests.
          # Vercel never sets this, so the deployed site keeps HSTS and both
          # https-forcing directives.
          SERVE_HTTP: "true"
          NEXT_PUBLIC_SITE_URL: https://claret.tech
          NEXT_PUBLIC_ENABLE_TERMINAL: true
          NEXT_PUBLIC_DEFAULT_LLM_MODEL: llama-3.2-1b
          NEXT_PUBLIC_ENABLE_AI_FEATURES: true
          USE_GITHUB_DATA: false
          MEDIUM_USERNAME: mock_username

      - name: Start Next.js Application
        run: |
          npm start &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          
          # Wait for server to be ready with retry logic
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200"; then
              echo "✅ Server is ready (attempt $i/30)"
              break
            fi
            echo "⏳ Waiting for server to start (attempt $i/30)..."
            sleep 2
          done
          
          # Final health check
          if ! curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200"; then
            echo "❌ Server failed to start after 60 seconds"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Mobile Tests
        run: |
          # Run dedicated mobile navigation and mobile accessibility tests
          # Both test files have built-in timeout handling and optimized scope for mobile
          npx playwright test tests/e2e/mobile-navigation.spec.ts tests/e2e/mobile-accessibility.spec.ts \
            --project="Mobile Chrome" --project="Mobile Safari" \
            --max-failures=2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_EXTERNAL_APIS: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          HOME: /root  # Fix potential browser launch issues

      - name: Stop Next.js Server
        if: always()
        run: |
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID || true
            echo "🛑 Server stopped (PID: $SERVER_PID)"
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true  # Don't fail job if artifact upload fails
        with:
          name: mobile-tests-report
          path: playwright-report/
          retention-days: 30

  # Comprehensive Lighthouse performance testing (optional)
  lighthouse-performance:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-jammy
      options: --user root
    needs: detect-changes  # Simplified dependencies to avoid cycles
    if: |
      (github.event.inputs.force_all_tests == 'true' ||
       github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'performance')) &&
      (github.event.inputs.force_all_tests == 'true' ||
       needs.detect-changes.outputs.lighthouse == 'true' ||
       needs.detect-changes.outputs.performance == 'true' ||
       needs.detect-changes.outputs.src == 'true' ||
       needs.detect-changes.outputs.dependencies == 'true' ||
       needs.detect-changes.outputs.workflows == 'true')

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium webkit

      - name: Build application
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Must be set HERE, on the build, not on `npm start`. Next evaluates
          # headers() during `next build` and bakes the result into
          # .next/routes-manifest.json; the runtime server only replays it, so
          # setting this at start time is silently inert (verified: build
          # without it + start with it still sends upgrade-insecure-requests).
          #
          # These jobs serve the production build over http://localhost:3000,
          # and that directive makes WebKit rewrite every asset URL to https
          # and fail on TLS - no CSS, no chunks, no React, 19 failed requests.
          # Vercel never sets this, so the deployed site keeps HSTS and both
          # https-forcing directives.
          SERVE_HTTP: "true"

      - name: Start application
        run: |
          npm start &
          sleep 30
          # Fixed: Discard HTML output to avoid curl buffer overflow (23) error
          curl --retry 10 --retry-delay 5 --retry-connrefused -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Lighthouse Tests
        run: npx playwright test tests/e2e/lighthouse.spec.ts --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOME: /root  # Fix potential browser launch issues

      # Safari-Specific Performance Tests removed - no matching tests exist
      # Regular performance tests already run on webkit project

      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true  # Don't fail job if artifact upload fails
        with:
          name: lighthouse-performance-reports
          path: playwright-report/
          retention-days: 90

  # Summary job to validate test execution
  playwright-summary:
    name: Playwright Tests Summary
    runs-on: ubuntu-latest
    needs: [
      detect-changes,
      navigation-tests,
      accessibility-tests,
      performance-tests,
      terminal-tests,
      mobile-tests,
      lighthouse-performance
    ]
    if: always()
    steps:
      - name: Check Test Execution
        run: |
          echo "=== Playwright Tests Summary ==="
          echo ""
          echo "Path Detection: ${{ needs.detect-changes.result }}"
          echo "Navigation Tests: ${{ needs.navigation-tests.result }}"
          echo "Accessibility Tests: ${{ needs.accessibility-tests.result }}"
          echo "Performance Tests: ${{ needs.performance-tests.result }}"
          echo "Terminal Tests: ${{ needs.terminal-tests.result }}"
          echo "Mobile Tests: ${{ needs.mobile-tests.result }}"
          echo "Lighthouse Tests: ${{ needs.lighthouse-performance.result }}"
          echo ""

          # A failed detection leaves every output empty, which reads below
          # as "no relevant changes".
          if [[ "${{ needs.detect-changes.result }}" == "failure" ]]; then
            echo "❌ Change detection failed"
            exit 1
          fi
          
          # Validate that at least some tests ran
          TESTS_RAN=false
          if [[ "${{ needs.navigation-tests.result }}" != "skipped" ]] || \
             [[ "${{ needs.accessibility-tests.result }}" != "skipped" ]] || \
             [[ "${{ needs.performance-tests.result }}" != "skipped" ]] || \
             [[ "${{ needs.terminal-tests.result }}" != "skipped" ]] || \
             [[ "${{ needs.mobile-tests.result }}" != "skipped" ]] || \
             [[ "${{ needs.lighthouse-performance.result }}" != "skipped" ]]; then
            TESTS_RAN=true
            echo "✅ Tests executed successfully"
          fi
          
          # On main branch or workflow changes, ensure critical tests ran
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || \
             [[ "${{ needs.detect-changes.outputs.workflows }}" == "true" ]]; then
            if [[ "${{ needs.navigation-tests.result }}" == "skipped" ]] && \
               [[ "${{ needs.accessibility-tests.result }}" == "skipped" ]]; then
              echo "❌ Critical tests were skipped on main branch or workflow change!"
              exit 1
            fi
          fi
          
          # If no tests ran when they should have
          if [[ "$TESTS_RAN" == "false" ]]; then
            echo "⚠️ Warning: All tests were skipped"
            # Check if this is expected (no relevant changes)
            if [[ "${{ needs.detect-changes.outputs.src }}" == "true" ]] || \
               [[ "${{ needs.detect-changes.outputs.tests }}" == "true" ]] || \
               [[ "${{ needs.detect-changes.outputs.workflows }}" == "true" ]]; then
              echo "❌ Tests should have run but were all skipped!"
              exit 1
            else
              echo "ℹ️ No relevant changes detected - skipping is expected"
            fi
          fi
          
          # Check for any failures
          if [[ "${{ needs.navigation-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.accessibility-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.performance-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.terminal-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.mobile-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.lighthouse-performance.result }}" == "failure" ]]; then
            echo "❌ Some tests failed!"
            exit 1
          fi
          
          echo "✅ Playwright test suite completed successfully!"
