name: Deploy to Vercel

on:
  workflow_dispatch:  # Manual trigger only - click button in Actions tab
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

# Least privilege: these workflows only read the repo and run tests.
# Without this they inherit the repo default, which is write.
permissions:
  contents: read

env:
  NODE_VERSION: '24'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# One deploy per environment at a time, in order: two dispatches could
# finish out of order and leave the older build serving.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Run all CI checks first
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  # The commit's browser tests (playwright.yml), which ci.yml does not run:
  # the dialogs, links, phones, accessibility and the 15% height budgets.
  # Waits for a run still going; refuses a failed run, one with a job
  # skipped, or code no run tested (see the script). After ci, so the
  # pushed head's run exists by then.
  browser-tests:
    name: Browser tests passed
    needs: ci
    runs-on: ubuntu-latest
    # Lighthouse alone may take 45 minutes, after the queue.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Wait for the commit's browser tests
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/browser-tests-passed.sh

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [ci, browser-tests]
    if: github.event.inputs.environment == 'preview'
    environment:
      name: Preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Vercel CLI
        # Its whole tree pinned by tools/vercel/package-lock.json, and no
        # install script runs: this job holds the deploy token. Bump it as
        # a change to that lockfile.
        run: |
          npm ci --prefix tools/vercel --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/tools/vercel/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Pull Vercel Environment Information
        # The token in the environment, which the CLI reads: on the command
        # line any process on the runner could read it.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview

      - name: Build Project Artifacts
        # The production build's env, which deploy-production's build step
        # takes from here (a YAML anchor), so a preview builds what
        # production would.
        env: &build-env
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Never the local http server's headers: SERVE_HTTP drops HSTS and
          # the https-forcing CSP (next.config.mjs), whatever Vercel's env says.
          SERVE_HTTP: "false"
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          USE_GITHUB_DATA: true
          # The account whose pinned repositories the build saves at
          # /profile.json (src/app/profile.json/route.ts), Projects' fallback
          # when the API fails. A public name, so no secret; Vercel's runtime
          # env holds its own copy for the API routes.
          GH_USERNAME: RomainClaret
          # The blog's Medium account; a leading @ is dropped
          # (src/lib/utils/medium-username.ts). Unset, romainclaret.
          NEXT_PUBLIC_MEDIUM_USERNAME: ${{ secrets.MEDIUM_USERNAME }}
          NEXT_PUBLIC_SITE_URL: https://claret.tech
        run: vercel build

      - name: Deploy to Vercel Preview
        id: deploy
        # Never under act (which sets ACT): .actrc hands it .env.act.local,
        # which holds the real Vercel token.
        if: ${{ !env.ACT }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt)
          echo "url=$url" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [ci, browser-tests]
    # Production from main only, whatever branch the dispatch names (the
    # Production environment allows main alone too).
    if: github.event.inputs.environment == 'production' && github.ref == 'refs/heads/main'
    environment:
      name: Production
      url: https://claret.tech
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Vercel CLI
        # Its whole tree pinned by tools/vercel/package-lock.json, and no
        # install script runs: this job holds the deploy token. Bump it as
        # a change to that lockfile.
        run: |
          npm ci --prefix tools/vercel --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/tools/vercel/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Pull Vercel Environment Information
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production

      - name: Build Project Artifacts
        # The env block defined in deploy-preview's build step above.
        env: *build-env
        run: vercel build --prod

      - name: Deploy to Vercel Production
        # Never under act, as the preview's.
        if: ${{ !env.ACT }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod