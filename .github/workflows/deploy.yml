name: Deploy to Vercel

on:
  workflow_dispatch:  # Manual trigger only - click button in Actions tab
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

# Least privilege: these workflows only read the repo and run tests.
# Without this they inherit the repo default, which is write.
permissions:
  contents: read

env:
  NODE_VERSION: '24'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # Run all CI checks first
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: ci
    if: github.event.inputs.environment == 'preview'
    environment:
      name: Preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Vercel CLI
        # Pinned: this job holds the deploy token. Bump it as a change.
        run: npm install -g vercel@64.7.0

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        # The production build's env, which deploy-production's build step
        # takes from here (a YAML anchor), so a preview builds what
        # production would.
        env: &build-env
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          USE_GITHUB_DATA: true
          # The account whose pinned repositories the build saves at
          # /profile.json (src/app/profile.json/route.ts), Projects' fallback
          # when the API fails. A public name, so no secret; Vercel's runtime
          # env holds its own copy for the API routes.
          GH_USERNAME: RomainClaret
          # The blog's Medium account; a leading @ is dropped
          # (src/lib/utils/medium-username.ts). Unset, romainclaret.
          NEXT_PUBLIC_MEDIUM_USERNAME: ${{ secrets.MEDIUM_USERNAME }}
          NEXT_PUBLIC_SITE_URL: https://claret.tech
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: ci
    if: github.event.inputs.environment == 'production'
    environment:
      name: Production
      url: https://claret.tech
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Vercel CLI
        # Pinned: this job holds the deploy token. Bump it as a change.
        run: npm install -g vercel@64.7.0

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        # The env block defined in deploy-preview's build step above.
        env: *build-env
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}