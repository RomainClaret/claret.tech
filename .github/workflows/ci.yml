name: CI

on:
  push:
    branches: ['**']  # All branches; '*' does not match slash names like feature/foo
  pull_request:
    branches: ['**']  # All pull requests
  workflow_call:  # Allow this workflow to be called by other workflows

# Least privilege: these workflows only read the repo and run tests.
# Without this they inherit the repo default, which is write.
permissions:
  contents: read

# Cancel superseded runs of the same ref (rapid pushes stack ~13 jobs each).
# Group includes the workflow name so a deploy-invoked run never collides
# with a push-triggered one.
#
# Not on main, though: each push there gets a group of its own (its SHA). A
# push is diffed against the branch's previous head, which assumes that head
# was tested; a cancelled run, or a pending one replaced by a later push,
# left the changes in between untested. Other branches can cancel freely:
# their pull request runs test the whole change.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # CI environment detection variables
  CI: true
  CONTINUOUS_INTEGRATION: true
  GITHUB_ACTIONS: true
  # Node.js optimization for CI - 8GB for component tests
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  # Phase 1: Detect what changed to run only necessary jobs
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source: ${{ steps.filter.outputs.source }}
      styles: ${{ steps.filter.outputs.styles }}
      config: ${{ steps.filter.outputs.config }}
      tests: ${{ steps.filter.outputs.tests }}
      test-setup: ${{ steps.filter.outputs.test-setup }}
      docs-only: ${{ steps.filter.outputs.docs-only }}
      has-code-changes: ${{ steps.filter.outputs.has-code-changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch full history for path filtering
          
      # The base decides which jobs run at all, and a wrong one passes CI
      # by skipping them: check the script before trusting it.
      - name: Check the diff-base script
        run: bash .github/scripts/diff-base.test.sh

      - name: Get base commit
        id: base_commit
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        # The branch's previous head, fetched by SHA after a force push; for
        # a deploy or manual run, the first commit (every job). See the
        # script for the rest.
        run: |
          base=$(bash .github/scripts/diff-base.sh)
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          base: ${{ steps.base_commit.outputs.base }}
          filters: |
            # What the unit tests run, for every unit-test job: anything under
            # src, the files under public that tests read from disk, and the
            # dependencies. Per-folder filters kept missing paths, since
            # components, contexts, hooks, lib, data and the API routes import
            # each other (the contexts import the toast, the API routes the
            # rate limiter and scrapers): each miss was a push to main that
            # skipped the tests exercising the change. The jobs run in
            # parallel, so this costs CI minutes, not time; pull requests ran
            # everything already.
            # All of public, not a list of files: the tests read the service
            # worker, the Python worker, publications.json and the PDF folder,
            # and listing only the Python worker skipped the others' tests.
            source:
              - 'src/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
            # Config files by glob: next and tailwind are .mjs and .ts, and
            # the .js names listed here before matched nothing, so a change to
            # either alone skipped the build.
            styles:
              - 'src/styles/**'
              - 'tailwind.config.*'
              - 'postcss.config.*'
              - 'src/**/*.module.css'
            config:
              - 'next.config.*'
              - 'tsconfig.json'
              - 'tsconfig.test.json'
              - '.eslintrc.json'
              - '.eslintignore'
              - '.prettierignore'
              - 'vitest.config.ts'
              - '.github/workflows/**'
              - '.github/scripts/**'
            tests:
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - 'tests/**'
            # What every test file runs under (the vitest config, the setup
            # files and shared test utilities): a change here can break any of
            # them, so every test job runs. Only quick checks and the build
            # read the config filter, so these used to skip all the tests.
            test-setup:
              - 'vitest.config.ts'
              - 'src/test/**'
            docs-only:
              - '**.md'
              - 'LICENSE'
              - '.gitignore'
            has-code-changes:
              - 'src/**'
              - 'public/**'
              - '*.config.{js,mjs,ts}'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              - '.github/scripts/**'

  # Phase 2: Quick validation jobs (run in parallel)
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    # Config too: lint, format and type-check read .eslintrc.json,
    # .prettierignore, tsconfig.json and tsconfig.test.json. And the tests:
    # type-check covers them (tests/e2e is outside has-code-changes).
    if: |
      always() && !cancelled() &&
      (needs.detect-changes.outputs.has-code-changes == 'true' ||
       needs.detect-changes.outputs.config == 'true' ||
       needs.detect-changes.outputs.tests == 'true')
    strategy:
      matrix:
        check: [lint, format, type-check]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run ${{ matrix.check }}
        run: |
          case "${{ matrix.check }}" in
            lint)
              npm run lint
              ;;
            format)
              npm run format -- --check
              ;;
            type-check)
              npm run type-check
              ;;
          esac

  # Phase 3: Test jobs (run conditionally based on changes)
  test-api:
    name: Test API Routes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: |
      always() && !cancelled() &&
      (needs.detect-changes.outputs.source == 'true' ||
       needs.detect-changes.outputs.test-setup == 'true' ||
       github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v6
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Cache API test results
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.cache/vitest
            .vitest-cache
          key: api-tests-${{ hashFiles('src/app/api/**', 'package-lock.json') }}
          restore-keys: api-tests-
      - run: npm run test:api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-utils:
    name: Test Utilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: |
      always() && !cancelled() &&
      (needs.detect-changes.outputs.source == 'true' ||
       needs.detect-changes.outputs.test-setup == 'true' ||
       github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v6
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Cache Utils test results
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.cache/vitest
            .vitest-cache
          key: utils-tests-${{ hashFiles('src/lib/utils/**', 'package-lock.json') }}
          restore-keys: utils-tests-
      - run: npm run test:utils

  test-components-batch1:
    name: Test Components - Batch 1 (UI Core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: |
      always() && !cancelled() &&
      (needs.detect-changes.outputs.source == 'true' ||
       needs.detect-changes.outputs.test-setup == 'true' ||
       github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v6
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Cache Component test results
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.cache/vitest
            .vitest-cache
          key: components-tests-batch1-${{ hashFiles('src/components/**', 'package-lock.json') }}
          restore-keys: components-tests-batch1-
      - run: npm run test:components:batch1
        env:
          NODE_OPTIONS: '--max-old-space-size=5120'

  test-components-batch2:
    name: Test Components - Batch 2 (UI Extended)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: |
      always() && !cancelled() &&
      (needs.detect-changes.outputs.source == 'true' ||
       needs.detect-changes.outputs.test-setup == 'true' ||
       github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v6
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Cache Component test results
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.cache/vitest
            .vitest-cache
          key: components-tests-batch2-${{ hashFiles('src/components/**', 'package-lock.json') }}
          restore-keys: components-tests-batch2-
      - run: npm run test:components:batch2
        env:
          NODE_OPTIONS: '--max-old-space-size=5120'

  test-components-batch3:
    name: Test Components - Batch 3 (Sections)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: |
      always() && !cancelled() &&
      (needs.detect-changes.outputs.source == 'true' ||
       needs.detect-changes.outputs.test-setup == 'true' ||
       github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v6
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Cache Component test results
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.cache/vitest
            .vitest-cache
          key: components-tests-batch3-${{ hashFiles('src/components/**', 'package-lock.json') }}
          restore-keys: components-tests-batch3-
      - run: npm run test:components:batch3
        env:
          NODE_OPTIONS: '--max-old-space-size=5120'

  test-components-batch4:
    name: Test Components - Batch 4 (Animations & Error)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: |
      always() && !cancelled() &&
      (needs.detect-changes.outputs.source == 'true' ||
       needs.detect-changes.outputs.test-setup == 'true' ||
       github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v6
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Cache Component test results
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.cache/vitest
            .vitest-cache
          key: components-tests-batch4-${{ hashFiles('src/components/**', 'package-lock.json') }}
          restore-keys: components-tests-batch4-
      - run: npm run test:components:batch4
        env:
          NODE_OPTIONS: '--max-old-space-size=5120'


  test-contexts:
    name: Test Contexts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: |
      always() && !cancelled() &&
      (needs.detect-changes.outputs.source == 'true' ||
       needs.detect-changes.outputs.test-setup == 'true' ||
       github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v6
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Cache Context test results
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.cache/vitest
            .vitest-cache
          key: contexts-tests-${{ hashFiles('src/contexts/**', 'package-lock.json') }}
          restore-keys: contexts-tests-
      - run: npm run test:contexts

  test-hooks:
    name: Test Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: |
      always() && !cancelled() &&
      (needs.detect-changes.outputs.source == 'true' ||
       needs.detect-changes.outputs.test-setup == 'true' ||
       github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v6
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Cache Hooks test results
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.cache/vitest
            .vitest-cache
          key: hooks-tests-${{ hashFiles('src/hooks/**', 'package-lock.json') }}
          restore-keys: hooks-tests-
      - run: npm run test:hooks

  test-lib-dom:
    name: Test Library DOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: |
      always() && !cancelled() &&
      (needs.detect-changes.outputs.source == 'true' ||
       needs.detect-changes.outputs.test-setup == 'true' ||
       github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v6
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Cache Library DOM test results
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.cache/vitest
            .vitest-cache
          key: lib-dom-tests-${{ hashFiles('src/lib/**', 'package-lock.json') }}
          restore-keys: lib-dom-tests-
      - run: npm run test:lib-dom

  test-unit:
    name: Test Non-DOM Units
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: |
      always() && !cancelled() &&
      (needs.detect-changes.outputs.has-code-changes == 'true' ||
       needs.detect-changes.outputs.test-setup == 'true' ||
       github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v6
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Cache Unit test results
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.cache/vitest
            .vitest-cache
          key: unit-tests-${{ hashFiles('src/**', 'package-lock.json') }}
          restore-keys: unit-tests-
      - run: npm run test:unit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Phase 4: Build job
  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: detect-changes
    if: |
      always() && !cancelled() &&
      (needs.detect-changes.outputs.has-code-changes == 'true' ||
       needs.detect-changes.outputs.config == 'true')
    env:
      NEXT_PUBLIC_SITE_URL: https://claret.tech
      NEXT_PUBLIC_ENABLE_TERMINAL: true
      NEXT_PUBLIC_DEFAULT_LLM_MODEL: llama-3.2-1b
      NEXT_PUBLIC_ENABLE_AI_FEATURES: true
      GITHUB_TOKEN: mock_token
      GITHUB_USERNAME: mock_username
      USE_GITHUB_DATA: false
      MEDIUM_USERNAME: mock_username
    steps:
      - uses: actions/checkout@v6
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Check build output
        run: |
          if [ ! -d ".next" ]; then
            echo "Build failed: .next directory not found"
            exit 1
          fi
          echo "Build successful"
      # / is generated at build time and served from the edge cache; a
      # request-dependent render or a middleware would quietly make every
      # page view a function call again.
      - name: Check the homepage is a static file
        run: node .github/scripts/check-static-home.mjs
      - name: Cache build output
        uses: actions/cache@v5
        with:
          path: .next
          key: build-${{ github.sha }}
          restore-keys: build-

  # Phase 5: Summary job
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [
      detect-changes, 
      quick-checks,
      test-api,
      test-utils, 
      test-components-batch1,
      test-components-batch2,
      test-components-batch3,
      test-components-batch4,
      test-contexts,
      test-hooks,
      test-lib-dom,
      test-unit, 
      build
    ]
    if: always() && !cancelled()
    steps:
      - name: Check results
        run: |
          echo "=== CI Results Summary ==="
          echo ""
          echo "Change Detection: ${{ needs.detect-changes.result }}"
          echo "Quick Checks: ${{ needs.quick-checks.result }}"
          echo "API Tests: ${{ needs.test-api.result }}"
          echo "Utils Tests: ${{ needs.test-utils.result }}"
          echo "Component Tests Batch 1: ${{ needs.test-components-batch1.result }}"
          echo "Component Tests Batch 2: ${{ needs.test-components-batch2.result }}"
          echo "Component Tests Batch 3: ${{ needs.test-components-batch3.result }}"
          echo "Component Tests Batch 4: ${{ needs.test-components-batch4.result }}"
          echo "Context Tests: ${{ needs.test-contexts.result }}"
          echo "Hooks Tests: ${{ needs.test-hooks.result }}"
          echo "Library DOM Tests: ${{ needs.test-lib-dom.result }}"
          echo "Unit Tests: ${{ needs.test-unit.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo ""
          
          # Check if any job failed. Detection too: when it fails, every job
          # below is skipped, and skipped is not failure.
          if [[ "${{ needs.detect-changes.result }}" == "failure" ]] || \
             [[ "${{ needs.quick-checks.result }}" == "failure" ]] || \
             [[ "${{ needs.test-api.result }}" == "failure" ]] || \
             [[ "${{ needs.test-utils.result }}" == "failure" ]] || \
             [[ "${{ needs.test-components-batch1.result }}" == "failure" ]] || \
             [[ "${{ needs.test-components-batch2.result }}" == "failure" ]] || \
             [[ "${{ needs.test-components-batch3.result }}" == "failure" ]] || \
             [[ "${{ needs.test-components-batch4.result }}" == "failure" ]] || \
             [[ "${{ needs.test-contexts.result }}" == "failure" ]] || \
             [[ "${{ needs.test-hooks.result }}" == "failure" ]] || \
             [[ "${{ needs.test-lib-dom.result }}" == "failure" ]] || \
             [[ "${{ needs.test-unit.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ Some CI checks failed!"
            exit 1
          else
            echo "✅ All CI checks passed!"
          fi